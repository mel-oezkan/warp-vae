model:
    target: ldm.models.autoencoder.PluckerAutoencoder
    params:
        embed_dim: 4
        n_patches: 8
        plucker_key: "pluck_ray"
        monitor: val/rec_loss
        ddconfig:
            double_z: true
            z_channels: 4
            resolution: 256
            in_channels: 3
            out_ch: 3
            ch: 128
            ch_mult:
                - 1
                - 2
                - 4
                - 4
            num_res_blocks: 2
            attn_resolutions: []
            dropout: 0.0
        lossconfig:
            target: torch.nn.Identity

training:
  image_size: 256
  val_size: 0.1
  # ema_decay: 0
  ema_decay: 0.999
  batch_size: 2
  lr: 1e-4
  num_epochs: 10
  kl_weight: 0.1
  lpips_loss_weight: 0.1
  precision: 32
  output_dir: "./outputs"
  note: "default"

wanddb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["vae", "finetuning", "stable-diffusion"]

data:
  dataset_type: "co3d"  # or "face"
  # For face dataset
  data_dir: "/data/lab_moezkan/omni_obj/blender_renders_24_views"

  # For CO3D dataset
  co3d_dir: "/data/lab_moezkan/co3d_full"
  bb_file: "/data/lab_moezkan/co3d_bboxes/toybus_test.jgz"
  apply_augmentation: true
  crop_images: true
  patch_num: 8