# DirectPluckerVAE (Variant 2) Configuration
#
# Similar to Variant 3 but treats Plucker prediction as a core auxiliary task.
# Unified latent space for both image and Plucker features.
# Decoder outputs both image and Plucker reconstruction.

model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.DirectPluckerVAE
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"
    plucker_key: "plucker_coords"

    # Loss weights
    plucker_recon_weight: 0.5
    plucker_constraint_weight: 0.1

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: 256
      in_channels: 9  # 3 (image) + 6 (plucker)
      out_ch: 3       # Image output only (plucker via separate head)
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 50001
        kl_weight: 0.000001
        disc_weight: 0.5
        perceptual_weight: 1.0
        disc_in_channels: 3
        disc_num_layers: 3
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.DirectPluckerVAETrainer
  params:
    plucker_key: "plucker_coords"
    plucker_recon_weight: 0.5
    plucker_constraint_weight: 0.1

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: co3d
      params:
        root_dir: ${data.co3d_dir}
        bb_file: ${data.bb_file}
        image_size: ${training.image_size}
        include_plucker: true
        full_resolution_plucker: true
        crop_images: true
        apply_augmentation: false
    batch_size: ${training.batch_size}
    val_split: ${training.val_split}
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    shuffle_train: true

# Data paths
co3d_dir: "/data/lab_moezkan/co3d_full"
bb_file: "/data/lab_moezkan/co3d_bboxes/toybus_test.jgz"

training:
  batch_size: 2
  image_size: 256
  num_epochs: 100
  lr: 4.5e-6
  kl_weight: 0.000001
  lpips_loss_weight: 1.0
  disc_lr: 4.5e-6
  ema_decay: 0.9999
  val_split: 0.2
  precision: 32
  output_dir: "./outputs/direct_plucker_vae_co3d"
  note: "DirectPluckerVAE (Variant 2) - Unified latent prediction"

  # Plucker loss weights
  plucker_recon_weight: 0.5
  plucker_constraint_weight: 0.1

wandb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["direct-plucker-vae", "variant-2", "co3d"]
