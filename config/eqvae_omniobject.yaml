model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.EQVAEAutoencoder
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    # EQ-VAE specific parameters
    p_prior: 0.9                    # Probability of applying equivariance regularization
    scale_range: [0.25, 1.0]        # Isotropic scaling range (0.25x to 1.0x)
    use_rotation: true              # Enable 90-degree rotations
    equivariance_weight: 1.0        # Weight for equivariance loss term

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 50001           # Start discriminator after 50k steps
        kl_weight: 0.000001         # KL divergence weight (minimal)
        disc_weight: 0.5            # Discriminator loss weight
        perceptual_weight: 1.0      # LPIPS perceptual loss weight
        disc_in_channels: 3
        disc_num_layers: 3
        use_actnorm: false

data:
  dataset_type: "omniobject"
  data_dir: "/data/lab_moezkan/omni_obj/blender_renders_24_views"
  pair_sampling: "sequential"      # Still loads pairs, but we'll use only first view
  patch_num: null                  # Not needed for EQ-VAE (no Plucker coords)

training:
  batch_size: 4
  image_size: 256
  num_workers: 8
  val_size: 0.1
  num_epochs: 100
  lr: 4.5e-6
  kl_weight: 0.000001
  lpips_loss_weight: 1.0
  plucker_loss_weight: 0.0         # Not used in EQ-VAE
  precision: 16
  output_dir: "./outputs/eqvae"
  note: "EQ-VAE with OmniObject dataset"

wanddb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["eqvae", "equivariance", "omniobject"]
