model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.EQVAEAutoencoder
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    # EQ-VAE specific parameters
    p_prior: 0.5
    p_prior_s: 0.25
    anisotropic: false
    use_rotation: true
    equivariance_weight: 1.0

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: ${training.image_size}
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 50001
        kl_weight: ${training.kl_weight}
        disc_weight: 0.5
        perceptual_weight: ${training.lpips_loss_weight}
        disc_in_channels: 3
        disc_num_layers: 3
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.EQVAETrainer

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: omniobject
      params:
        root_dir: "/data/lab_moezkan/omni_obj/blender_renders_24_views"
        image_size: ${training.image_size}
        include_plucker: false
        sample_mode: single
    batch_size: ${training.batch_size}
    val_split: ${training.val_split}
    num_workers: ${training.num_workers}
    pin_memory: true
    persistent_workers: true
    shuffle_train: true

training:
  batch_size: 4
  image_size: 256
  num_workers: 8
  val_split: 0.1
  num_epochs: 100
  lr: 4.5e-6
  kl_weight: 0.000001
  lpips_loss_weight: 1.0
  ema_decay: 0.9999
  precision: 16
  output_dir: "./outputs/eqvae"
  note: "EQ-VAE with OmniObject dataset"

wandb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["eqvae", "equivariance", "omniobject"]
