# WARP-VAE on OmniObject3D with precomputed RoMA warps
# No background → no spurious background patterns in warp loss
#
# Prerequisites:
#   1. python preprocess_omniobject.py \
#        --data_root /data/lab_moezkan/omni_obj/blender_renders_24_views \
#        --output_file data/omniobject_annotations/omniobject_1700.jgz \
#        --max_objects 1700
#
#   2. CUDA_VISIBLE_DEVICES=0,1 python precompute_warps.py \
#        --annotation_file data/omniobject_annotations/omniobject_1700.jgz \
#        --output_dir /data/lab_moezkan/precomputed_warps/omniobject_1700 \
#        --root_dir /data/lab_moezkan/omni_obj/blender_renders_24_views \
#        --pair_mode stratified \
#        --distance_bins 0.5 2.5 \
#        --num_pairs_per_bin 1 \
#        --num_workers 2 --gpu_ids 0 1 \
#        --cycle_consistency_threshold 0
#
# Train:
#   CUDA_VISIBLE_DEVICES=0 python train.py --config-name=warp_vae_omniobject

model:
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: ${training.image_size}
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 10000
        kl_weight: ${training.kl_weight}
        disc_weight: 0.5
        perceptual_weight: ${training.lpips_loss_weight}
        disc_in_channels: 3
        disc_num_layers: 2
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.WarpVAETrainer
  params:
    target_key: "image_target"
    warp_consistency_weight: 0.1
    warp_reconstruction_weight: 0.0
    warp_recon_pixel_weight: 0.0
    warp_recon_perceptual_weight: 0.0
    consistency_loss_type: "cosine"
    bidirectional: true
    confidence_weighted: true
    loss_confidence_threshold: 0.2
    warmup_steps: 5000
    vanilla_probability: 0.5
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: precomputed_warp
      params:
        root_dir: "/data/lab_moezkan/omni_obj/blender_renders_24_views"
        bb_file: "data/omniobject_annotations/omniobject_1700.jgz"
        warp_dir: "/visinf/projects_students/dlcv2025_groupZ/precomputed_warps/omniobject_1700"
        image_size: ${training.image_size}
        confidence_threshold: 0.25
        crop_images: false
    batch_size: ${training.batch_size}
    val_split: ${training.val_split}
    num_workers: ${training.num_workers}
    pin_memory: true
    persistent_workers: true
    shuffle_train: true
    prefetch_factor: 4

training:
  batch_size: 2
  image_size: 256
  num_workers: 4
  val_split: 0.1
  num_epochs: 100
  lr: 1.0e-5
  kl_weight: 0.0001
  lpips_loss_weight: 1.0
  ema_decay: 0.9999
  precision: 32
  output_dir: "./outputs/warp_vae_omniobject"
  checkpoint_every_n_epochs: 5
  checkpoint_every_n_steps: 5000
  log_every_n_steps: 50
  gradient_accumulation_steps: 4
  note: "omniobject3d, RoMA warps, cosine consistency, no background"

wandb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["warp-vae", "precomputed", "omniobject3d", "cosine", "no-background"]
