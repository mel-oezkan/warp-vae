# EQ-VAE training on CO3D hydrant 50-sequence subset
# Step-matched to Warp VAE run e4ksa79v (~58K optimizer steps)
#
# Dataset: 50seq (4915 frames), val_split=0.2 → ~3932 train images
# batch_size=2, 30 epochs → ~58,980 optimizer steps (vs 57,939 in Warp VAE ref)
#
# Run: CUDA_VISIBLE_DEVICES=0,1 python train.py --config-name=eqvae_co3d_hydrant_50seq

model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.EQVAEAutoencoder
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    # EQ-VAE specific parameters (matching zelaki/eqvae defaults)
    p_prior: 0.5           # Probability of applying equivariance regularization
    p_prior_s: 0.25        # Probability of low-res prior preservation (when not EQ-VAE)
    anisotropic: false     # Isotropic scaling (not independent x/y)
    use_rotation: true     # Enable 90-degree rotations
    equivariance_weight: 1.0

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 15000
        kl_weight: 0.00001
        disc_weight: 0.5
        perceptual_weight: 1.0
        disc_in_channels: 3
        disc_num_layers: 3
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.EQVAETrainer
  params: {}

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: co3d
      params:
        root_dir: "/visinf/projects_students/dlcv2025_groupZ/co3d_full"
        bb_file: "data/co3d_annotations/hydrant_train_50seq.jgz"
        image_size: 256
        include_plucker: false
        crop_images: false
        apply_augmentation: false
    batch_size: 2
    val_split: 0.2
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    shuffle_train: true

training:
  batch_size: 2
  image_size: 256
  num_workers: 4
  val_split: 0.2
  num_epochs: 30
  lr: 4.5e-6
  kl_weight: 0.00001
  lpips_loss_weight: 1.0
  ema_decay: 0.9999
  precision: 32
  output_dir: "./outputs/eqvae_co3d_hydrant_50seq"
  log_every_n_steps: 50
  checkpoint_every_n_steps: 20000
  checkpoint_every_n_epochs: 5
  note: "EQ-VAE on CO3D hydrant 50seq, step-matched to Warp VAE e4ksa79v (~58K steps)"

wandb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["eqvae", "equivariance", "co3d", "hydrant", "50seq", "step-matched"]
