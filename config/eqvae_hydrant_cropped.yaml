# EQ-VAE training on CO3D hydrant 50seq (CROPPED)
# Matched to warp_vae_hydrant_recon_crop runs for fair comparison
#
# Run: CUDA_VISIBLE_DEVICES=1 python train.py --config-name=eqvae_hydrant_cropped +pretrained_weights="./weights/f8/model.ckpt"

model:
  target: ldm.models.autoencoder.EQVAEAutoencoder
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    # EQ-VAE specific parameters
    p_prior: 0.5
    p_prior_s: 0.25
    anisotropic: false
    use_rotation: true
    equivariance_weight: 1.0

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: ${training.image_size}
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 2000
        kl_weight: ${training.kl_weight}
        disc_weight: 0.5
        perceptual_weight: ${training.lpips_loss_weight}
        disc_in_channels: 3
        disc_num_layers: 2
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.EQVAETrainer
  params: {}

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: co3d
      params:
        root_dir: "/visinf/projects_students/dlcv2025_groupZ/co3d_full"
        bb_file: "data/co3d_annotations/hydrant_train_50seq.jgz"
        image_size: ${training.image_size}
        include_plucker: false
        crop_images: true
        apply_augmentation: false
    batch_size: ${training.batch_size}
    val_split: ${training.val_split}
    num_workers: ${training.num_workers}
    pin_memory: true
    persistent_workers: true
    shuffle_train: true
    prefetch_factor: 4

training:
  batch_size: 1
  image_size: 256
  num_workers: 4
  val_split: 0.2
  num_epochs: 200
  lr: 1.0e-5
  kl_weight: 0.0001
  lpips_loss_weight: 1.0
  ema_decay: 0.9999
  precision: 32
  output_dir: "./outputs/eqvae_hydrant_cropped"
  checkpoint_every_n_epochs: 5
  checkpoint_every_n_steps: 5000
  log_every_n_steps: 50
  gradient_accumulation_steps: 4
  note: "EQ-VAE on CO3D hydrant 50seq cropped, matched to warp_vae_hydrant_recon_crop runs"

wandb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["eqvae", "equivariance", "co3d", "hydrant", "50seq", "cropped"]
