# Warp VAE configuration with PRECOMPUTED warps for faster training
# Uses precomputed RoMaV2 warps - no RoMaV2 needed during training!
#
# SPEEDUP: This config enables:
#   - num_workers > 0 (parallel data loading)
#   - No RoMaV2 GPU memory during training (~2GB freed)
#   - Larger batch sizes possible
#   - Single GPU training (no DDP overhead)
#
# PREREQUISITES:
#   1. Precompute warps first:
#      python precompute_warps.py \
#          --bb_file /data/lab_moezkan/co3d_bboxes/toybus_test.jgz \
#          --output_dir /data/lab_moezkan/precomputed_warps/toybus \
#          --root_dir /data/lab_moezkan/co3d_full \
#          --romav2_setting turbo \
#          --max_pair_distance 20 \
#          --num_pairs_per_sample 3
#
#   2. Run training:
#      CUDA_VISIBLE_DEVICES=0 python train.py --config-name=warp_vae_co3d_precomputed

model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: ${training.image_size}
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 15000
        kl_weight: ${training.kl_weight}
        disc_weight: 0.5
        perceptual_weight: ${training.lpips_loss_weight}
        disc_in_channels: 3
        disc_num_layers: 3
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.WarpVAETrainer
  params:
    target_key: "image_target"
    warp_consistency_weight: 1.0
    warp_reconstruction_weight: 0.0
    consistency_loss_type: "l1"
    bidirectional: true
    confidence_weighted: true
    loss_confidence_threshold: 0.2
    warmup_steps: 5000
    vanilla_probability: 0
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: precomputed_warp              # Uses PrecomputedWarpDataset - no RoMaV2!
      params:
        root_dir: "/data/lab_moezkan/co3d_full"
        bb_file: "/data/lab_moezkan/co3d_bboxes/toybus_test.jgz"
        warp_dir: "/data/lab_moezkan/precomputed_warps/toybus"  # Precomputed warp files
        image_size: ${training.image_size}
        confidence_threshold: 0.25           # Threshold for valid correspondences
    batch_size: ${training.batch_size}
    val_split: ${training.val_split}
    num_workers: ${training.num_workers}
    pin_memory: true                        # Can enable now with workers > 0
    persistent_workers: true                # Keep workers alive between epochs
    shuffle_train: true

training:
  batch_size: 2                             # Can increase! No RoMaV2 memory overhead
  image_size: 256
  num_workers: 4                            # Can use workers now! No CUDA in dataloader
  val_split: 0.2
  num_epochs: 20
  lr: 1e-5                                  # Increased from 1e-6 for faster convergence
  kl_weight: 1e-05                          # Increased from 1e-6 for better latent regularization
  lpips_loss_weight: 1.0
  ema_decay: 0.9999
  precision: 32
  output_dir: "./outputs/warp_vae_co3d_precomputed"
  checkpoint_every_n_epochs: 5
  log_every_n_steps: 50
  gradient_accumulation_steps: 4            # Can reduce since batch_size increased

wandb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["warp-vae", "precomputed", "co3d", "multi-view-consistency", "fast"]
