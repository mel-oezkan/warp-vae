# Memory-efficient Warp VAE config for testing on limited GPU memory
# Reduced model capacity for GTX 1080 Ti (11GB VRAM)

model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: 128                     # Reduced from 256
      in_channels: 3
      out_ch: 3
      ch: 64                              # Reduced from 128
      ch_mult: [1, 2, 4]                  # Reduced from [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 50001
        kl_weight: 0.000001
        disc_weight: 0.5
        perceptual_weight: 1.0
        disc_in_channels: 3
        disc_num_layers: 2                # Reduced from 3
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.WarpVAETrainer
  params:
    target_key: "image_target"
    warp_consistency_weight: 0.5
    warp_reconstruction_weight: 0.0
    consistency_loss_type: "l1"
    bidirectional: true
    confidence_weighted: true
    confidence_threshold: 0.1
    warmup_steps: 1000                    # Reduced warmup for faster testing

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: warp_co3d
      params:
        root_dir: "/data/lab_moezkan/co3d_full"
        bb_file: "/data/lab_moezkan/co3d_bboxes/toybus_test.jgz"
        image_size: 128                   # Reduced from 256
        romav2_setting: "turbo"           # Use turbo for lowest memory
        pair_sampling: "random"
        max_pair_distance: 10
        warp_resolution: 128              # Match image size
        confidence_threshold: 0.5
        include_plucker: false
    batch_size: 4                         # Can use larger batch with smaller images
    val_split: 0.1
    num_workers: 0                        # Must be 0 for RoMaV2 (CUDA in dataloader workers)
    pin_memory: false
    persistent_workers: false
    shuffle_train: true

training:
  batch_size: 4
  image_size: 128
  num_workers: 0                          # Must be 0 for RoMaV2
  val_size: 0.1
  num_epochs: 20
  lr: 4.5e-6
  kl_weight: 0.000001
  lpips_loss_weight: 1.0
  ema_decay: 0.9999
  precision: 16
  output_dir: "./outputs/warp_vae_co3d_small"
  checkpoint_every_n_epochs: 2
  log_every_n_steps: 10

wandb:
  enabled: true                           # Enabled for tracking
  project: enhanced-VAE
  entity: deep_cv
  tags: ["warp-vae", "romav2", "co3d", "small-model", "test"]
