# WARP-VAE training on CO3D hydrant with precomputed warps
# Warp consistency only (no WarpReconstructionLoss)
# Training settings matched to latest EQ-VAE run (eqvae_co3d_hydrant)
#
# Run: CUDA_VISIBLE_DEVICES=0,1 python train.py --config-name=warp_vae_hydrant

model:
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    embed_dim: 4
    monitor: val/rec_loss
    image_key: "image"

    ddconfig:
      double_z: true
      z_channels: 4
      resolution: ${training.image_size}
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 2, 4, 4]
      num_res_blocks: 2
      attn_resolutions: []
      dropout: 0.0

    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 15000
        kl_weight: ${training.kl_weight}
        disc_weight: 0.5
        perceptual_weight: ${training.lpips_loss_weight}
        disc_in_channels: 3
        disc_num_layers: 3
        use_actnorm: false

trainer:
  target: src.trainer.vae_trainers.WarpVAETrainer
  params:
    target_key: "image_target"
    warp_consistency_weight: 1.0
    warp_reconstruction_weight: 0.0
    consistency_loss_type: "l1"
    bidirectional: true
    confidence_weighted: true
    loss_confidence_threshold: 0.2
    warmup_steps: 5000
    vanilla_probability: 0
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}

data:
  target: src.data.datamodule.VAEDataModule
  params:
    dataset_config:
      type: precomputed_warp
      params:
        root_dir: "/visinf/projects_students/dlcv2025_groupZ/co3d_full"
        bb_file: "data/co3d_annotations/hydrant_train_50seq.jgz"
        warp_dir: "/visinf/projects_students/dlcv2025_groupZ/precomputed_warps/hydrant_50seq_nocrop"
        image_size: ${training.image_size}
        confidence_threshold: 0.25
        crop_images: false
    batch_size: ${training.batch_size}
    val_split: ${training.val_split}
    num_workers: ${training.num_workers}
    pin_memory: true
    persistent_workers: true
    shuffle_train: true
    prefetch_factor: 4    # Each worker pre-loads 4 batches ahead; hides .pt file I/O latency

training:
  batch_size: 2    # Per-GPU batch size for 2-GPU DDP run (2 per GPU × 2 GPUs = 4 effective)
  image_size: 256
  num_workers: 4
  val_split: 0.2
  num_epochs: 20
  lr: 1.0e-5
  kl_weight: 0.00001
  lpips_loss_weight: 1.0
  ema_decay: 0.9999
  precision: 32
  output_dir: "./outputs/warp_vae_hydrant"
  checkpoint_every_n_epochs: 5
  checkpoint_every_n_steps: 20000
  log_every_n_steps: 50
  gradient_accumulation_steps: 4    # Effective batch = batch_size * grad_accum * n_gpus
  # limit_train_batches: 10000      # Removed: train on full dataset
  note: "hydrant 50seq nocrop, toybus-matched hparams: kl=1e-5, warp_w=1, disc_w=0.5, disc_start=15k, grad_accum=4"

wandb:
  enabled: true
  project: enhanced-VAE
  entity: deep_cv
  tags: ["warp-vae", "co3d", "hydrant", "close-warps", "rebalanced"]
